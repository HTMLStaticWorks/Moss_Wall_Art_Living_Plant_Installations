<!DOCTYPE html>
<html lang="en" class="scroll-smooth" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Verdant Walls Portal</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { forest: '#2D4F1E', sage: '#8FA885', earth: '#D4BDAC', ecoLight: '#F9FBF7', ecoDark: '#121412' },
                    fontFamily: { outfit: ['Outfit', 'sans-serif'], inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="bg-ecoLight text-ecoDark dark:bg-ecoDark dark:text-ecoLight min-h-screen flex flex-col items-center justify-start md:justify-center p-4 sm:p-6 pt-24 md:pt-6 relative">

    <!-- Accessibility Controls -->
    <div class="fixed top-4 right-4 md:top-8 md:right-8 flex items-center space-x-2 md:space-x-4 z-[100]">
        <button id="rtl-toggle" class="rtl-toggle-btn bg-white dark:bg-white/10 border border-forest/10 rounded-xl hover:bg-forest hover:text-white transition-all duration-300 shadow-xl active:scale-95 flex items-center justify-center w-10 h-10 md:w-[50px] md:h-[50px]" title="Toggle RTL">
            <span class="text-[9px] md:text-[10px] font-bold uppercase tracking-widest pointer-events-none">RTL</span>
        </button>
        <button id="theme-toggle" class="bg-white dark:bg-white/10 border border-forest/10 rounded-xl hover:bg-forest hover:text-white transition-all duration-300 shadow-xl active:scale-95 flex items-center justify-center w-10 h-10 md:w-[50px] md:h-[50px]" title="Toggle Theme">
            <svg class="w-4 h-4 md:w-5 md:h-5 dark:hidden text-forest pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></svg>
            <svg class="w-4 h-4 md:w-5 md:h-5 hidden dark:block text-sage pointer-events-none" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>

    <!-- Signup Container -->
    <div class="w-full max-w-md" data-aos="fade-up">
        <!-- Logo -->
        <div class="flex justify-center mb-12">
            <a href="index.html" class="flex items-center space-x-2 group">
                <div class="w-12 h-12 bg-forest rounded-full flex items-center justify-center transition-transform group-hover:rotate-12">
                    <i data-lucide="leaf" class="text-white w-7 h-7"></i>
                </div>
                <span class="text-3xl font-outfit font-bold tracking-tight text-sage">VERDANT</span>
            </a>
        </div>
            <div id="auth-container" class="bg-white dark:bg-ecoDark p-8 md:p-12 rounded-[3rem] shadow-[0_32px_64px_-16px_rgba(45,79,30,0.15)] border border-forest/5 space-y-8">
                <!-- Header -->
                <div class="text-center">
                    <h2 id="auth-title" class="text-4xl font-outfit font-bold mb-2">Create Account</h2>
                    <p id="auth-subtitle" class="text-gray-500">Join the Verdant community today.</p>
                </div>

                <!-- Forms -->
                <div class="relative">
                    <!-- Signup Form (Primary) -->
                    <form id="signup-form" class="space-y-5 transition-all duration-500">
                        <div class="space-y-5">
                            <div class="space-y-2">
                                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">First Name</label>
                                <input type="text" placeholder="Jane" class="w-full px-6 py-4 rounded-2xl bg-ecoLight dark:bg-[#1a1c1a] border border-forest/10 focus:border-forest outline-none transition-all">
                            </div>
                            <div class="space-y-2">
                                <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Last Name</label>
                                <input type="text" placeholder="Doe" class="w-full px-6 py-4 rounded-2xl bg-ecoLight dark:bg-[#1a1c1a] border border-forest/10 focus:border-forest outline-none transition-all">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Email Address</label>
                            <input type="email" placeholder="jane@example.com" class="w-full px-6 py-4 rounded-2xl bg-ecoLight dark:bg-[#1a1c1a] border border-forest/10 focus:border-forest outline-none transition-all">
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-bold uppercase tracking-widest text-gray-400">Password</label>
                            <div class="relative group/pass">
                                <input type="password" id="signup-password" placeholder="Min. 8 characters" class="w-full px-6 py-4 rounded-2xl bg-ecoLight dark:bg-[#1a1c1a] border border-forest/10 focus:border-forest outline-none transition-all pr-12">
                                <button type="button" class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-forest transition-colors p-1" data-target="signup-password">
                                    <i data-lucide="eye" class="w-5 h-5 eye-icon"></i>
                                    <i data-lucide="eye-off" class="w-5 h-5 eye-off-icon hidden"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-start space-x-2">
                            <input type="checkbox" id="terms" class="mt-1 w-4 h-4 rounded border-forest/10 text-forest focus:ring-forest">
                            <label for="terms" class="text-sm text-gray-500">I agree to the <a href="#" class="text-forest underline">Terms of Service</a> and <a href="#" class="text-forest underline">Privacy Policy</a>.</label>
                        </div>
                        <button type="submit" class="btn-premium w-full py-4 text-lg">Create Account</button>
                        
                        <!-- Toggle to Login -->
                        <div class="text-center mt-8">
                            <p class="text-sm text-gray-500">Already have an account? 
                                <a href="login.html" class="text-forest font-bold hover:underline">Log in</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>


        
        <footer class="mt-12 text-center text-xs text-gray-400">
            &copy; 2026 Verdant Walls Installations. <br>
            <a href="index.html" class="hover:text-forest underline">Privacy</a> &bull; <a href="index.html" class="hover:text-forest underline">Terms</a>
        </footer>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        // AOS and Lucide are initialized in main.js
        
        // Password Toggle Logic
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.password-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const targetId = btn.getAttribute('data-target');
                    const passInput = document.getElementById(targetId);
                    const eyeIcon = btn.querySelector('.eye-icon');
                    const eyeOffIcon = btn.querySelector('.eye-off-icon');

                    if (passInput.type === 'password') {
                        passInput.type = 'text';
                        eyeIcon.classList.add('hidden');
                        eyeOffIcon.classList.remove('hidden');
                    } else {
                        passInput.type = 'password';
                        eyeIcon.classList.remove('hidden');
                        eyeOffIcon.classList.add('hidden');
                    }
                });
            });
        });
    </script>
    <button id="scroll-top" title="Back to Top">
        <i data-lucide="chevron-up"></i>
    </button>
</body>
</html>
