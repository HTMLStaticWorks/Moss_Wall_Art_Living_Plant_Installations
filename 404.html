<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 | Lost in the Forest</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { forest: '#2D4F1E', sage: '#8FA885', ecoLight: '#F9FBF7', ecoDark: '#121412' },
                    fontFamily: { outfit: ['Outfit', 'sans-serif'], inter: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-ecoLight text-ecoDark dark:bg-ecoDark dark:text-ecoLight min-h-screen flex items-center justify-center p-6 overflow-hidden">

    <div class="max-w-4xl w-full text-center relative">
        <!-- 1. Animated Botanical Illustration -->
        <div class="mb-12 relative inline-block" data-aos="zoom-in">
            <div class="w-64 h-64 md:w-80 md:h-80 bg-sage/20 rounded-full flex items-center justify-center relative animate-pulse">
                <i data-lucide="leaf" class="text-forest w-32 h-32 md:w-40 md:h-40 rotate-12"></i>
            </div>
            <div class="absolute -top-10 -right-10 animate-bounce delay-100"><i data-lucide="help-circle" class="text-sage w-12 h-12"></i></div>
            <div class="absolute -bottom-10 -left-10 animate-bounce delay-300"><i data-lucide="compass" class="text-forest w-16 h-16"></i></div>
        </div>

        <!-- 2. Error Message Content -->
        <div data-aos="fade-up">
            <h1 class="text-8xl md:text-9xl font-outfit font-bold text-forest/10 mb-4">404</h1>
            <h2 class="text-3xl md:text-5xl font-outfit font-bold mb-6">Lost in the <span class="text-sage">Foliage?</span></h2>
            <p class="text-xl text-gray-500 mb-12 max-w-lg mx-auto">The botanical page you're looking for has either been pruned or moved to a different forest.</p>
        </div>

        <!-- 3. Navigation Buttons -->
        <div class="flex flex-col sm:flex-row justify-center space-y-4 sm:space-y-0 sm:space-x-6 mb-16" data-aos="fade-up" data-aos-delay="100">
            <a href="index.html" class="btn-premium px-10 py-4 flex items-center justify-center">
                <i data-lucide="home" class="mr-2 w-5 h-5"></i> Back to Civilization
            </a>
            <a href="services.html" class="px-10 py-4 border border-forest/20 rounded-full font-bold hover:bg-forest/5 transition-all flex items-center justify-center">
                Our Services
            </a>
        </div>

        <!-- 4. Suggested Useful Links -->
        <div class="pt-10 border-t border-forest/5" data-aos="fade-up" data-aos-delay="200">
            <p class="text-xs font-bold uppercase tracking-widest text-gray-400 mb-6">Might we suggest</p>
            <div class="flex flex-wrap justify-center gap-8 text-sm font-medium">
                <a href="about.html" class="hover:text-forest transition-colors flex items-center"><i data-lucide="users" class="w-4 h-4 mr-2"></i> About Us</a>
                <a href="pricing.html" class="hover:text-forest transition-colors flex items-center"><i data-lucide="tag" class="w-4 h-4 mr-2"></i> Pricing</a>
                <a href="contact.html" class="hover:text-forest transition-colors flex items-center"><i data-lucide="message-square" class="w-4 h-4 mr-2"></i> Contact</a>
            </div>
        </div>
    </div>

    <!-- Floating Particles in Background -->
    <script src="js/main.js"></script>
    <script>
        AOS.init();
        lucide.createIcons();
    </script>
    <button id="scroll-top" title="Back to Top">
        <i data-lucide="chevron-up"></i>
    </button>
</body>
</html>
